<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#25163e">
<title>Candy Hop — Лови конфетки!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211438;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow:hidden;background:#27183e}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.chip{color:#fff;background:#291a45d9;border:1px solid #ffffff45;border-radius:18px;padding:8px 13px;font-weight:900;font-size:14px;box-shadow:0 5px 18px #0c061c55;backdrop-filter:blur(8px)}.right{display:flex;gap:8px;pointer-events:auto}.round{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff55;background:#291a45e8;color:#fff;font-size:19px;font-weight:900}.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:16px;right:16px;text-align:center;color:#fff9d9;font-size:13px;font-weight:800;text-shadow:0 2px 6px #160a2a;pointer-events:none}.veil{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#160c29b8;backdrop-filter:blur(9px)}.panel{width:min(100%,350px);text-align:center;color:white;padding:27px 23px 24px;border-radius:30px;border:1px solid #ffffff55;background:linear-gradient(155deg,#8154a8,#392255 68%,#26163e);box-shadow:0 22px 60px #09041199}.mascot{font-size:64px;filter:drop-shadow(0 8px 10px #160a2a88)}h1{font-size:32px;line-height:1.05;margin:5px 0 10px;letter-spacing:-1px}p{color:#f6eaff;line-height:1.45;margin:0 0 20px;font-size:15px}.primary{border:0;border-radius:17px;padding:14px 34px;background:linear-gradient(#fff49b,#ffbd3d);color:#5c2b14;font-size:18px;font-weight:1000;box-shadow:0 5px 0 #b96c20,0 12px 22px #10071d66}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #b96c20}.hide{display:none!important}.small{font-size:12px;color:#e4d3f4;margin-top:15px}
</style>
</head>
<body>
<main id="game">
<canvas id="c"></canvas>
<div class="hud"><div class="chip" id="score">🍬 0</div><div class="chip" id="lives">❤️ ❤️ ❤️</div><div class="right"><button class="round" id="sound" aria-label="Звук">♫</button><button class="round" id="pause" aria-label="Пауза">Ⅱ</button></div></div>
<div class="bottom" id="tip">Веди котика пальцем и лови конфетки!</div>
<section class="veil" id="veil"><div class="panel"><div class="mascot">🐈‍⬛</div><h1 id="title">Candy Hop</h1><p id="desc">Поймай как можно больше конфеток! Двигай котика пальцем — он сам подпрыгнет, поймает сладость и съест её.</p><button class="primary" id="play">Играть</button><div class="small">Маленький котик. Большая любовь к конфетам.</div></div></section>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s),canvas=$('#c'),ctx=canvas.getContext('2d'),root=$('#game');
const W=390,H=844;let scale=1,ox=0,oy=0,dpr=1,playing=false,paused=false,muted=false,last=0,elapsed=0,spawn=0,score=0,lives=3,best=0,cat={x:195,y:716,vy:0,jump:0,chew:0,blink:0,tilt:0},candies=[],particles=[],stars=[],pointer=null,shake=0;
try{best=Number(localStorage.getItem('candyhop-best')||0)}catch(e){}
function fit(){const r=root.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);scale=Math.min(r.width/W,r.height/H);ox=(r.width-W*scale)/2;oy=(r.height-H*scale)/2;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);if(!playing)draw()}
function rand(a,b){return a+Math.random()*(b-a)}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function background(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#201437');g.addColorStop(.52,'#55366f');g.addColorStop(1,'#a65d91');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // soft moonlit window
 rounded(248,105,112,174,13,'#30214c');ctx.strokeStyle='#d3a7e8';ctx.lineWidth=7;ctx.strokeRect(252,109,104,166);ctx.fillStyle='#33214d';ctx.fillRect(256,113,96,158);
 ctx.fillStyle='#ffe8a5';ctx.beginPath();ctx.arc(326,148,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#33214d';ctx.beginPath();ctx.arc(335,141,17,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#b88ad4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(304,113);ctx.lineTo(304,271);ctx.moveTo(256,191);ctx.lineTo(352,191);ctx.stroke();
 // shelves and jars
 rounded(0,330,144,15,5,'#754b7f');rounded(248,365,142,15,5,'#754b7f');
 for(let i=0;i<4;i++){let xx=15+i*31;rounded(xx,289,22,39,7,['#f28ab2','#79d6d0','#ffd477','#a78be8'][i]);rounded(xx+4,282,14,9,3,'#f7d9a3')}
 for(let i=0;i<4;i++){let xx=262+i*30;rounded(xx,324,20,39,7,['#ffb0c9','#82d9d2','#ffdc86','#b39bea'][i]);rounded(xx+4,317,12,8,3,'#f7d9a3')}
 // floor
 ctx.fillStyle='#3b244e';ctx.fillRect(0,780,W,64);ctx.fillStyle='#c47aaf';ctx.fillRect(0,780,W,8);
 // floating motes
 for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#ffe7ad';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
}
function candyShape(x,y,r,angle,gold=false){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.shadowColor=gold?'#ffe27a':'#ff5c9b';ctx.shadowBlur=18;
 // wrappers
 ctx.fillStyle=gold?'#f6c84f':'#f4e8ff';ctx.beginPath();ctx.moveTo(-r*.72,-r*.35);ctx.lineTo(-r*1.42,-r*.9);ctx.lineTo(-r*1.35,0);ctx.lineTo(-r*1.42,r*.9);ctx.lineTo(-r*.65,r*.42);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(r*.72,-r*.35);ctx.lineTo(r*1.42,-r*.9);ctx.lineTo(r*1.35,0);ctx.lineTo(r*1.42,r*.9);ctx.lineTo(r*.65,r*.42);ctx.closePath();ctx.fill();
 const g=ctx.createRadialGradient(-r*.35,-r*.4,2,0,0,r*1.2);g.addColorStop(0,'#fff');g.addColorStop(.35,gold?'#fff2a1':'#ffb6d1');g.addColorStop(.72,gold?'#ffce48':'#fa477f');g.addColorStop(1,gold?'#b87520':'#b91d63');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(0,0,r*.94,0,Math.PI*2);ctx.clip();ctx.strokeStyle=gold?'#fff8d7':'#fff';ctx.lineWidth=r*.34;for(let i=-2;i<3;i++){ctx.beginPath();ctx.arc(i*r*.48,0,r*.78,-2.5,.75);ctx.stroke()}ctx.restore();
 ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(-r*.32,-r*.42,r*.2,r*.11,-.5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function catDraw(){
 const x=cat.x,y=cat.y-cat.jump;ctx.save();ctx.translate(x,y);ctx.rotate(cat.tilt);const bob=Math.sin(elapsed*5)*1.8*(cat.jump===0?1:.25);
 ctx.translate(0,bob);const squash=cat.jump>0?1-cat.jump*.00025:1;
 // shadow
 ctx.globalAlpha=.25*(1-Math.min(cat.jump/115,1));ctx.fillStyle='#170c28';ctx.beginPath();ctx.ellipse(0,53,51+cat.jump*.12,10,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 ctx.scale(1/squash,squash);
 // tail
 ctx.strokeStyle='#241435';ctx.lineWidth=17;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(40,28);ctx.bezierCurveTo(75,8,66,-28,43,-25);ctx.stroke();ctx.strokeStyle='#5c3a7b';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(40,26);ctx.bezierCurveTo(70,8,62,-23,43,-22);ctx.stroke();
 // body
 let fur=ctx.createRadialGradient(-20,0,5,0,25,75);fur.addColorStop(0,'#71528f');fur.addColorStop(.55,'#38234f');fur.addColorStop(1,'#171026');ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(0,29,48,58,0,0,Math.PI*2);ctx.fill();
 // paws
 ctx.fillStyle='#28183c';ctx.beginPath();ctx.ellipse(-28,66,19,13,-.2,0,Math.PI*2);ctx.ellipse(28,66,19,13,.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d987b5';ctx.beginPath();ctx.ellipse(-28,69,8,4,0,0,Math.PI*2);ctx.ellipse(28,69,8,4,0,0,Math.PI*2);ctx.fill();
 // head
 ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(0,-29,62,56,0,0,Math.PI*2);ctx.fill();
 // ears
 ctx.fillStyle='#241536';ctx.beginPath();ctx.moveTo(-48,-62);ctx.quadraticCurveTo(-70,-125,-20,-89);ctx.lineTo(-8,-62);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(48,-62);ctx.quadraticCurveTo(70,-125,20,-89);ctx.lineTo(8,-62);ctx.closePath();ctx.fill();
 ctx.fillStyle='#df8ab8';ctx.beginPath();ctx.moveTo(-47,-78);ctx.lineTo(-57,-111);ctx.lineTo(-23,-88);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(47,-78);ctx.lineTo(57,-111);ctx.lineTo(23,-88);ctx.closePath();ctx.fill();
 // eyes and blink
 const blink=cat.blink>0&&cat.blink<.13;for(const ex of [-25,25]){ctx.fillStyle='#fff';ctx.beginPath();if(blink){ctx.ellipse(ex,-37,15,3,0,0,Math.PI*2)}else{ctx.ellipse(ex,-39,17,21,0,0,Math.PI*2)}ctx.fill();if(!blink){ctx.fillStyle='#8a58c7';ctx.beginPath();ctx.ellipse(ex+2,-38,11,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#100a1b';ctx.beginPath();ctx.ellipse(ex+3,-37,5,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-2,-47,5,0,Math.PI*2);ctx.fill()}}
 // muzzle and mouth
 ctx.fillStyle='#eeb1cc';ctx.beginPath();ctx.ellipse(0,-10,16,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4a173d';ctx.beginPath();ctx.arc(0,-9,4,0,Math.PI*2);ctx.fill();
 const open=cat.chew>0;ctx.fillStyle='#210b25';ctx.beginPath();if(open){ctx.ellipse(0,5,cat.chew>0?12:8,10+Math.sin(elapsed*24)*2,0,0,Math.PI*2)}else{ctx.moveTo(0,-5);ctx.quadraticCurveTo(-5,4,-10,0);ctx.moveTo(0,-5);ctx.quadraticCurveTo(5,4,10,0)}ctx.fill();if(open){ctx.fillStyle='#f18aa9';ctx.beginPath();ctx.ellipse(0,11,6,3,0,0,Math.PI*2);ctx.fill()}
 // whiskers
 ctx.strokeStyle='#e5c8e9';ctx.lineWidth=1.5;for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(side*12,-8);ctx.lineTo(side*37,-13);ctx.moveTo(side*12,-3);ctx.lineTo(side*39,1);ctx.stroke()}
 // collar and bell
 ctx.strokeStyle='#d84c8d';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,13,35,.2,Math.PI-.2);ctx.stroke();const bell=ctx.createRadialGradient(-3,23,1,0,25,10);bell.addColorStop(0,'#fff4a9');bell.addColorStop(.5,'#ffd64e');bell.addColorStop(1,'#a66a19');ctx.fillStyle=bell;ctx.beginPath();ctx.arc(0,25,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#87551a';ctx.beginPath();ctx.arc(0,28,2,0,Math.PI*2);ctx.fill();
 // jumping paws
 if(cat.jump>8){ctx.strokeStyle='#251536';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-34,30);ctx.lineTo(-54,13);ctx.moveTo(34,30);ctx.lineTo(54,13);ctx.stroke();ctx.fillStyle='#df8ab8';ctx.beginPath();ctx.arc(-54,13,6,0,7);ctx.arc(54,13,6,0,7);ctx.fill()}
 ctx.restore();
}
function burst(x,y,color){for(let i=0;i<15;i++){const a=rand(0,Math.PI*2),s=rand(50,190);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.7),max:.7,r:rand(2,5),color})}}
function spawnCandy(){const gold=Math.random()<.12;candies.push({x:rand(38,352),y:-35,vy:rand(105,145)+Math.min(score*2,95),vx:rand(-15,15),r:gold?18:17,angle:rand(0,6),spin:rand(-2.5,2.5),gold,trail:[]})}
function soundCatch(){if(muted)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!window.audioCtx)window.audioCtx=new A();const ac=window.audioCtx;if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),gain=ac.createGain();o.type='sine';o.frequency.setValueAtTime(520,ac.currentTime);o.frequency.exponentialRampToValueAtTime(980,ac.currentTime+.12);gain.gain.setValueAtTime(.12,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.connect(gain);gain.connect(ac.destination);o.start();o.stop(ac.currentTime+.23)}catch(e){}}
function catchCandy(c){score+=c.gold?5:1;$('#score').textContent='🍬 '+score;cat.chew=.55;cat.jump=95;cat.vy=0;cat.tilt=rand(-.08,.08);burst(c.x,c.y,c.gold?'#ffe77d':'#ff9bc7');soundCatch();if(score>best){best=score;try{localStorage.setItem('candyhop-best',String(best))}catch(e){}}}
function miss(){lives--;$('#lives').textContent='❤️ '.repeat(lives)+'🖤 '.repeat(3-lives);shake=.22;if(lives<=0){playing=false;$('#title').textContent='Ой, конфетки убежали!';$('#desc').textContent='Ты поймал '+score+' конфеток. Рекорд: '+best+'. Попробуем ещё раз?';$('#play').textContent='Ещё раз';$('#veil').classList.remove('hide')}}
function update(dt){
 elapsed+=dt;spawn-=dt;if(spawn<=0){spawnCandy();spawn=Math.max(.55,1.22-score*.009)}
 cat.x+=((pointer===null?cat.x:pointer)-cat.x)*Math.min(1,dt*8);cat.x=Math.max(55,Math.min(335,cat.x));
 if(cat.jump>0){cat.jump+=cat.vy*dt;cat.vy-=480*dt;if(cat.jump<=0){cat.jump=0;cat.vy=0;cat.tilt=0}}
 if(cat.chew>0)cat.chew=Math.max(0,cat.chew-dt);if(cat.blink>0)cat.blink-=dt;else if(Math.random()<dt*.45)cat.blink=.18;
 for(let i=candies.length-1;i>=0;i--){const c=candies[i];c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(elapsed*2+c.angle)*10*dt;c.angle+=c.spin*dt;c.trail.push({x:c.x,y:c.y});if(c.trail.length>5)c.trail.shift();
 const mouthY=cat.y-cat.jump-2;const dx=Math.abs(c.x-cat.x),dy=Math.abs(c.y-mouthY);
 if(dx<42&&dy<38&&cat.jump<115){catchCandy(c);candies.splice(i,1);continue}
 if(c.y>805){candies.splice(i,1);miss();continue}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 shake=Math.max(0,shake-dt);
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(rand(-4,4),rand(-3,3));background();
 // candy trails and candies
 for(const c of candies){for(let i=0;i<c.trail.length;i++){const t=c.trail[i];ctx.globalAlpha=(i+1)/c.trail.length*.13;ctx.fillStyle=c.gold?'#ffe58a':'#ff9fc5';ctx.beginPath();ctx.arc(t.x,t.y,c.r*(i+1)/c.trail.length*.55,0,7);ctx.fill()}ctx.globalAlpha=1;candyShape(c.x,c.y,c.r,c.angle,c.gold)}
 catDraw();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();
}
function loop(now){if(!playing||paused)return;const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}
function start(){score=0;lives=3;elapsed=0;spawn=.25;candies=[];particles=[];cat={x:195,y:716,vy:0,jump:0,chew:0,blink:0,tilt:0};pointer=null;paused=false;playing=true;$('#score').textContent='🍬 0';$('#lives').textContent='❤️ ❤️ ❤️';$('#pause').textContent='Ⅱ';$('#tip').textContent='Веди котика пальцем и лови конфетки!';$('#veil').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
canvas.addEventListener('pointerdown',e=>{if(!playing||paused)return;canvas.setPointerCapture(e.pointerId);pointer=pos(e).x});canvas.addEventListener('pointermove',e=>{if(pointer!==null&&playing&&!paused)pointer=pos(e).x});['pointerup','pointercancel','pointerleave'].forEach(n=>canvas.addEventListener(n,()=>pointer=null));
$('#play').addEventListener('click',start);$('#pause').addEventListener('click',()=>{if(!playing)return;paused=!paused;$('#pause').textContent=paused?'▶':'Ⅱ';if(paused){$('#tip').textContent='Пауза'}else{$('#tip').textContent='Веди котика пальцем и лови конфетки!';last=performance.now();requestAnimationFrame(loop)}});$('#sound').addEventListener('click',()=>{muted=!muted;$('#sound').textContent=muted?'♫̸':'♫'});addEventListener('resize',fit);
for(let i=0;i<48;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,2),a:rand(.12,.55)});
fit();draw();
})();
</script>
</body>
</html>
