<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#21153d"><title>Candy Hop</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#21153d;font-family:system-ui,sans-serif;touch-action:none}#app{height:100dvh;width:min(100vw,520px);margin:auto;position:relative;background:#21153d}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.pill,.btn{border:1px solid #ffffff66;background:#39265beF;color:#fff;border-radius:18px;padding:9px 12px;font-weight:900;box-shadow:0 4px 14px #08041177}.btn{pointer-events:auto;border-radius:50%;width:42px;height:42px;font-size:20px;padding:0}.hint{position:absolute;bottom:env(safe-area-inset-bottom);left:12px;right:12px;padding:10px;text-align:center;color:white;background:#211538cc;border:1px solid #fff4;border-radius:15px;font-size:13px;font-weight:800;pointer-events:none}.veil{position:absolute;inset:0;display:grid;place-items:center;background:#10091dcc;backdrop-filter:blur(8px);padding:20px}.panel{max-width:340px;text-align:center;padding:25px;border:1px solid #fff8;border-radius:26px;background:linear-gradient(145deg,#704ba0,#2c1c49);color:white}.panel h1{margin:5px;font-size:30px}.panel p{line-height:1.45}.primary{border:0;border-radius:16px;padding:14px 30px;background:linear-gradient(#fff18b,#ffb52e);font-size:18px;font-weight:1000;color:#572900}.hide{display:none!important}</style><main id="app"><canvas id="c"></canvas><div class="hud"><span class="pill" id="score">☆ ☆ ☆</span><span class="pill">УРОВЕНЬ 1</span><span><button class="btn" id="reset">↻</button> <button class="btn" id="pause">Ⅱ</button></span></div><div class="hint" id="hint">Проведи пальцем по верёвке ✂️</div><section class="veil" id="veil"><div class="panel"><div style="font-size:48px">🍬</div><h1 id="title">Candy Hop</h1><p id="desc">Раскачай конфетку, перережь верёвки в нужный момент и доставь её котику.</p><button class="primary" id="play">Играть</button></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script><script>
(()=>{const $=s=>document.querySelector(s),c=$('#c'),x=c.getContext('2d'),app=$('#app'),veil=$('#veil');if(!window.Matter){$('#desc').textContent='Не загрузился физический движок. Проверь интернет.';return}const M=Matter,W=390,H=844;let eng,world,b,ropes=[],stars=[],active=false,pause=false,score=0,last=0,scale=1,ox=0,bits=[];
function fit(){let r=app.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;scale=Math.min(r.width/W,r.height/H);ox=(r.width/scale-W)/2;x.setTransform(d*scale,0,0,d*scale,0,0);if(!active)draw()}
function init(){eng=M.Engine.create();world=eng.world;world.gravity.y=1;world.gravity.scale=.00065;b=M.Bodies.circle(195,275,18,{density:.0015,frictionAir:.025,restitution:.25});M.World.add(world,b);let anchors=[M.Bodies.circle(88,115,4,{isStatic:true}),M.Bodies.circle(302,115,4,{isStatic:true})];M.World.add(world,anchors);ropes=anchors.map(a=>({a,j:M.Constraint.create({bodyA:a,bodyB:b,length:Math.hypot(195-a.position.x,275-a.position.y),stiffness:.99,damping:.07}),alive:true}));ropes.forEach(r=>M.World.add(world,r.j));[[195,825,390,35],[10,490,20,220],[380,490,20,220],[75,570,110,14],[315,615,110,14],[195,770,155,15]].forEach(([a,y,w,h])=>M.World.add(world,M.Bodies.rectangle(a,y,w,h,{isStatic:true,restitution:.3})));stars=[{x:100,y:420,g:false},{x:294,y:465,g:false},{x:195,y:675,g:false}];score=0;bits=[];$('#score').textContent='☆ ☆ ☆';$('#hint').textContent='Проведи пальцем по верёвке ✂️'}
function near(px,py,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-a.x-t*dx,py-a.y-t*dy)}
function cut(px,py){if(!active||pause)return;for(let r of ropes)if(r.alive&&near(px,py,r.a.position,b.position)<26){r.alive=false;M.World.remove(world,r.j);$('#hint').textContent=ropes.some(q=>q.alive)?'Раскачай конфетку и выбери момент!':'Конфетка свободна — направь её к котику';break}}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/scale-ox,y:(e.clientY-r.top)/scale}}
let down=false,prev; c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);prev=point(e);cut(prev.x,prev.y)});c.addEventListener('pointermove',e=>{if(!down)return;let p=point(e);for(let i=1;i<=8;i++)cut(prev.x+(p.x-prev.x)*i/8,prev.y+(p.y-prev.y)*i/8);prev=p});['pointerup','pointercancel'].forEach(n=>c.addEventListener(n,()=>down=false));
function room(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#20143b');g.addColorStop(.6,'#604077');g.addColorStop(1,'#a967a0');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#17152f';x.fillRect(250,110,112,180);x.strokeStyle='#b98ce0';x.lineWidth=8;x.strokeRect(250,110,112,180);x.beginPath();x.moveTo(306,110);x.lineTo(306,290);x.moveTo(250,200);x.lineTo(362,200);x.stroke();x.fillStyle='#ffe4a0';x.beginPath();x.arc(330,150,12,0,7);x.fill();for(let i=0;i<28;i++){x.globalAlpha=.3;x.fillStyle='#fff0c7';x.beginPath();x.arc((i*73)%390,(i*47)%590,1.5,0,7);x.fill()}x.globalAlpha=1;x.fillStyle='#39244d';x.fillRect(0,790,390,54);x.fillStyle='#c17bb5';x.fillRect(0,790,390,8);x.fillStyle='#74477c';x.fillRect(18,340,110,13);for(let i=0;i<3;i++){x.fillStyle=['#ffb5d4','#8ee1e1','#ffdb83'][i];x.beginPath();x.roundRect(30+i*30,305,20,30,6);x.fill()}}
function star(s){x.save();x.shadowColor='#ffe05b';x.shadowBlur=18;x.fillStyle='#ffdf5a';x.strokeStyle='#fff4b0';x.lineWidth=2;x.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?8:18;x.lineTo(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r)}x.closePath();x.fill();x.stroke();x.restore()}
function cat(){x.save();x.translate(195,744);let f=x.createRadialGradient(-18,-50,5,0,0,100);f.addColorStop(0,'#7654a5');f.addColorStop(.6,'#34204f');f.addColorStop(1,'#100a20');x.shadowColor='#d58aff';x.shadowBlur=20;x.fillStyle=f;x.beginPath();x.ellipse(0,40,58,64,0,0,7);x.fill();x.beginPath();x.ellipse(0,-30,68,64,0,0,7);x.fill();x.beginPath();x.moveTo(-54,-60);x.quadraticCurveTo(-68,-128,-18,-86);x.lineTo(-8,-60);x.fill();x.beginPath();x.moveTo(54,-60);x.quadraticCurveTo(68,-128,18,-86);x.lineTo(8,-60);x.fill();x.shadowBlur=0;x.fillStyle='#e98dbb';x.beginPath();x.moveTo(-51,-77);x.lineTo(-57,-111);x.lineTo(-24,-87);x.fill();x.beginPath();x.moveTo(51,-77);x.lineTo(57,-111);x.lineTo(24,-87);x.fill();for(let a of [-27,27]){x.fillStyle='white';x.beginPath();x.ellipse(a,-42,21,25,0,0,7);x.fill();x.fillStyle='#7f4bc6';x.beginPath();x.ellipse(a,-41,14,19,0,0,7);x.fill();x.fillStyle='#130b25';x.beginPath();x.ellipse(a,-40,6,15,0,0,7);x.fill();x.fillStyle='white';x.beginPath();x.arc(a-5,-51,5,0,7);x.fill()}x.fillStyle='#f08eae';x.beginPath();x.arc(0,-8,5,0,7);x.fill();x.fillStyle='#1b0b2a';x.beginPath();x.ellipse(0,7,10,8,0,0,7);x.fill();x.strokeStyle='#cf478d';x.lineWidth=8;x.beginPath();x.arc(0,40,38,.2,Math.PI-.2);x.stroke();let gold=x.createRadialGradient(-4,50,1,0,52,12);gold.addColorStop(0,'#fff2a5');gold.addColorStop(.5,'#ffd044');gold.addColorStop(1,'#a56817');x.fillStyle=gold;x.beginPath();x.arc(0,52,10,0,7);x.fill();x.restore()}
function candy(){x.save();x.translate(b.position.x,b.position.y);x.rotate(b.angle);x.shadowColor='#ff528c';x.shadowBlur=18;let g=x.createRadialGradient(-7,-8,2,0,0,22);g.addColorStop(0,'white');g.addColorStop(.55,'#ff6b88');g.addColorStop(1,'#b90c4d');x.fillStyle=g;x.beginPath();x.arc(0,0,19,0,7);x.fill();x.save();x.beginPath();x.arc(0,0,18,0,7);x.clip();x.strokeStyle='#fff9ef';x.lineWidth=6;for(let i=0;i<3;i++){x.beginPath();x.arc(-2+i*5,0,11,-2.4,.8);x.stroke()}x.restore();x.restore()}
function draw(){x.clearRect(0,0,W,H);room();stars.forEach(s=>{if(!s.g)star(s)});ropes.forEach(r=>{if(!r.alive)return;let a=r.a.position;x.strokeStyle='#8b4b34';x.lineWidth=7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.position.x,b.position.y);x.stroke();x.strokeStyle='#ffe1a5';x.lineWidth=3;x.stroke();x.fillStyle='#74d9ff';x.beginPath();x.arc(a.x,a.y,8,0,7);x.fill()});candy();cat()}
function frame(now){if(!active||pause)return;let dt=Math.min((now-last)/1000,.025);last=now;M.Engine.update(eng,dt*1000);let v=b.velocity,s=Math.hypot(v.x,v.y);if(s>6.8)M.Body.setVelocity(b,{x:v.x*6.8/s,y:v.y*6.8/s});for(let a of stars)if(!a.g&&Math.hypot(b.position.x-a.x,b.position.y-a.y)<28){a.g=true;score++;$('#score').textContent=['★ ☆ ☆','★ ★ ☆','★ ★ ★'][score-1]}if(Math.hypot(b.position.x-195,b.position.y-710)<38){active=false;$('#title').textContent='Котик съел конфетку!';$('#desc').textContent='Ты собрал звёзд: '+score+'/3';$('#play').textContent='Ещё раз';veil.classList.remove('hide');return}if(b.position.y>870||b.position.x<-40||b.position.x>430){M.Body.setPosition(b,{x:195,y:275});M.Body.setVelocity(b,{x:0,y:0});M.Body.setAngularVelocity(b,0);ropes.forEach(r=>{if(!r.alive){r.alive=true;M.World.add(world,r.j)}});$('#hint').textContent='Попробуй снова — конфетка вернулась на место.'}draw();requestAnimationFrame(frame)}
function start(){init();veil.classList.add('hide');active=true;pause=false;last=performance.now();requestAnimationFrame(frame)}
$('#play').addEventListener('click',start);$('#reset').addEventListener('click',start);$('#pause').addEventListener('click',()=>{if(!active)return;pause=!pause;$('#pause').textContent=pause?'▶':'Ⅱ';if(!pause){last=performance.now();requestAnimationFrame(frame)}});addEventListener('resize',fit);fit();init();draw()})();
</script></body></html>
