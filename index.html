<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#21133e"><title>Candy Hop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17102e;font-family:system-ui,-apple-system,sans-serif}#game{position:relative;width:min(100%,560px);height:100dvh;margin:auto;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 75%,#75459c 0%,#38245f 48%,#17142f 100%)}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.pill{background:linear-gradient(145deg,#56348bdf,#28194feF);border:1px solid #e4baff8c;border-radius:20px;padding:8px 13px;color:#fff;font-weight:900;box-shadow:0 5px 20px #0b062a80;text-shadow:0 2px 4px #140b2a}.stars{font-size:25px;letter-spacing:3px;color:#ffe06a}.level{font-size:13px}.tools{display:flex;gap:8px;pointer-events:auto}.tool{border:1px solid #e6c8ff99;border-radius:50%;width:42px;height:42px;color:#fff;background:linear-gradient(145deg,#784bc0,#37215e);font-size:20px;box-shadow:0 4px 12px #09051d80}.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:14px;right:14px;text-align:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 2px 7px #10051e;background:#24143b9c;border:1px solid #d9b7ff55;border-radius:16px;padding:10px}.modal{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#10091dbb;backdrop-filter:blur(8px)}.panel{width:min(100%,340px);text-align:center;background:linear-gradient(145deg,#7544b4,#35205f);border:2px solid #f2d6ff;border-radius:28px;padding:25px;color:#fff;box-shadow:0 12px 40px #0b061c}h1{font-size:32px;margin:0 0 8px}p{line-height:1.45;color:#f5eaff}button.primary{border:0;border-radius:18px;background:linear-gradient(#fff18a,#ffb52d);padding:14px 28px;font-weight:1000;font-size:18px;color:#5b2c00;box-shadow:0 5px 0 #bd701b}.sub{font-size:12px;opacity:.8;margin-top:12px}
</style></head><body><main id="game"><canvas id="c"></canvas><div class="hud"><div class="pill stars" id="score">☆ ☆ ☆</div><div class="pill level">УРОВЕНЬ 1</div><div class="tools"><button class="tool" id="restart" aria-label="Заново">↻</button><button class="tool" id="pause" aria-label="Пауза">Ⅱ</button></div></div><div class="hint" id="hint">Проведи пальцем по верёвке, чтобы перерезать её ✂️</div><section class="modal" id="modal"><div class="panel"><h1 id="title">Candy Hop</h1><div style="font-size:52px">🍭</div><p id="desc">Помоги пушистому котёнку поймать конфетку! Перерезай верёвки, собирай звёзды и доставь сладость прямо ему в рот.</p><button class="primary" id="start">Играть</button><div class="sub">Свайпай по верёвкам • Собери 3 звезды</div></div></section></main>
<script>
(()=>{const root=document.querySelector('#game'),cv=document.querySelector('#c'),ctx=cv.getContext('2d'),modal=document.querySelector('#modal'),start=document.querySelector('#start');let W,H,D,active=false,paused=false,last=0,score=0,candy,ropes=[],stars=[],t=0,won=false;
function resize(){const r=root.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(!active)draw()}
function init(){const y=H*.17;candy={x:W*.5,y:H*.34,px:W*.5,py:H*.34,vx:0,vy:0,r:24};ropes=[{ax:W*.25,ay:y,len:Math.hypot(W*.25-candy.x,y-candy.y),alive:true,angle:Math.atan2(candy.x-W*.25,candy.y-y),omega:0},{ax:W*.75,ay:y,len:Math.hypot(W*.75-candy.x,y-candy.y),alive:true,angle:Math.atan2(candy.x-W*.75,candy.y-y),omega:0}];stars=[{x:W*.22,y:H*.48,got:false},{x:W*.78,y:H*.48,got:false},{x:W*.5,y:H*.63,got:false}];score=0;won=false;document.querySelector('#score').textContent='☆ ☆ ☆';document.querySelector('#hint').textContent='Проведи пальцем по верёвке, чтобы перерезать её ✂️'}
function lineDist(px,py,x1,y1,x2,y2){let dx=x2-x1,dy=y2-y1,k=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-x1-k*dx,py-y1-k*dy)}
function syncRope(){const alive=ropes.filter(r=>r.alive);if(alive.length===1){const r=alive[0];candy.x=r.ax+Math.sin(r.angle)*r.len;candy.y=r.ay+Math.cos(r.angle)*r.len}}
function cutAt(x,y,swipeX=0,swipeY=0){if(!active||paused)return;for(const r of ropes){if(!r.alive)continue;const ax=r.ax,ay=r.ay,bx=candy.x,by=candy.y;if(lineDist(x,y,ax,ay,bx,by)<30){r.alive=false;const remaining=ropes.filter(q=>q.alive);if(remaining.length===1){const q=remaining[0];q.angle=Math.atan2(candy.x-q.ax,candy.y-q.ay);const tangential=(candy.vx*Math.cos(q.angle)-candy.vy*Math.sin(q.angle))/q.len;q.omega=tangential-Math.sign(q.angle)*4.2+Math.max(-2.5,Math.min(2.5,(swipeX*Math.cos(q.angle)-swipeY*Math.sin(q.angle))*.035));}else if(remaining.length===0){candy.vx+=swipeX*11;candy.vy+=swipeY*11;}document.querySelector('#hint').textContent=remaining.length?'Отлично! Конфетка уже раскачивается — перережь вторую верёвку!':'Конфетка летит! Собери звёзды и попади к котику 🍬';break}}}
let down=false,lastPX=0,lastPY=0;cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);const b=cv.getBoundingClientRect();lastPX=e.clientX-b.left;lastPY=e.clientY-b.top;cutAt(lastPX,lastPY)});cv.addEventListener('pointermove',e=>{if(!down)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,dx=x-lastPX,dy=y-lastPY;cutAt(x,y,dx,dy);lastPX=x;lastPY=y});cv.addEventListener('pointerup',()=>down=false);cv.addEventListener('pointercancel',()=>down=false);
function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#20153f');g.addColorStop(.55,'#49306e');g.addColorStop(1,'#a05e9c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#17132d';ctx.fillRect(W*.67,H*.15,W*.25,H*.47);ctx.strokeStyle='#b18be0';ctx.lineWidth=9;ctx.strokeRect(W*.67,H*.15,W*.25,H*.47);ctx.beginPath();ctx.moveTo(W*.795,H*.15);ctx.lineTo(W*.795,H*.62);ctx.moveTo(W*.67,H*.385);ctx.lineTo(W*.92,H*.385);ctx.stroke();ctx.fillStyle='#c7a1ff';ctx.beginPath();ctx.arc(W*.83,H*.25,18,0,7);ctx.fill();for(let i=0;i<28;i++){let x=(i*83+31)%W,y=(i*47+21)%(H*.7);ctx.fillStyle=i%3?'#fff3c8':'#e7aaff';ctx.globalAlpha=.22+(i%4)*.13;ctx.beginPath();ctx.arc(x,y,1.2+(i%3),0,7);ctx.fill()}ctx.globalAlpha=1;
ctx.fillStyle='#39234f';ctx.fillRect(0,H*.74,W,H*.26);ctx.fillStyle='#75417e';ctx.fillRect(0,H*.76,W,H*.04);ctx.fillStyle='#bd80b8';ctx.beginPath();ctx.ellipse(W*.5,H*.9,W*.31,H*.07,0,0,7);ctx.fill();ctx.fillStyle='#edb4e9';ctx.beginPath();ctx.ellipse(W*.5,H*.88,W*.28,H*.05,0,0,7);ctx.fill();
ctx.fillStyle='#613e78';ctx.fillRect(W*.03,H*.43,W*.22,12);ctx.fillRect(W*.03,H*.43,9,H*.17);ctx.fillStyle='#ffcc83';ctx.beginPath();ctx.arc(W*.13,H*.39,18,Math.PI,0);ctx.fill();ctx.fillStyle='#ffe7a1';ctx.beginPath();ctx.ellipse(W*.13,H*.39,12,5,0,0,7);ctx.fill()}
function drawStar(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#ffd83d';ctx.shadowBlur=15;ctx.fillStyle='#ffdf54';ctx.strokeStyle='#fff4a8';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?8:18;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawKitten(){let x=W*.5,y=H*.83;ctx.save();ctx.translate(x,y);
let fur=ctx.createRadialGradient(-12,-25,5,0,0,75);fur.addColorStop(0,'#6941a1');fur.addColorStop(.65,'#34204f');fur.addColorStop(1,'#160e2b');ctx.shadowColor='#c17aff';ctx.shadowBlur=18;
// body
ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(0,45,47,53,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(-37,47,17,0,7);ctx.fill();
// ears
ctx.beginPath();ctx.moveTo(-51,-24);ctx.quadraticCurveTo(-60,-90,-17,-62);ctx.lineTo(-5,-30);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(51,-24);ctx.quadraticCurveTo(60,-90,17,-62);ctx.lineTo(5,-30);ctx.closePath();ctx.fill();ctx.fillStyle='#e88cc9';ctx.beginPath();ctx.moveTo(-47,-38);ctx.lineTo(-48,-69);ctx.lineTo(-23,-48);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(47,-38);ctx.lineTo(48,-69);ctx.lineTo(23,-48);ctx.closePath();ctx.fill();
// head
ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(0,-18,58,52,0,0,7);ctx.fill();
// cheeks
ctx.fillStyle='#e8c6ed';ctx.beginPath();ctx.ellipse(-23,2,18,12,0,0,7);ctx.ellipse(23,2,18,12,0,0,7);ctx.fill();
// eyes
for(const ex of [-23,23]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,-25,19,22,0,0,7);ctx.fill();let iris=ctx.createRadialGradient(ex,-27,2,ex,-25,15);iris.addColorStop(0,'#a85bff');iris.addColorStop(1,'#4520a4');ctx.fillStyle=iris;ctx.beginPath();ctx.ellipse(ex,-23,12,16,0,0,7);ctx.fill();ctx.fillStyle='#170d32';ctx.beginPath();ctx.ellipse(ex,-22,5,12,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-4,-31,4,0,7);ctx.fill()}
ctx.fillStyle='#f18ba9';ctx.beginPath();ctx.moveTo(-6,-5);ctx.quadraticCurveTo(0,-11,6,-5);ctx.quadraticCurveTo(0,3,-6,-5);ctx.fill();ctx.fillStyle='#1c0b28';ctx.beginPath();ctx.arc(0,8,12,0,Math.PI);ctx.fill();ctx.fillStyle='#ff7caa';ctx.beginPath();ctx.ellipse(0,13,7,7,0,0,7);ctx.fill();
// whiskers
ctx.strokeStyle='#e9d9f7';ctx.lineWidth=1.5;for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(s*28,5);ctx.lineTo(s*61,0);ctx.moveTo(s*29,11);ctx.lineTo(s*59,16);ctx.stroke()}
// paws
ctx.fillStyle='#d9c4ec';ctx.beginPath();ctx.ellipse(-23,83,15,9,0,0,7);ctx.ellipse(23,83,15,9,0,0,7);ctx.fill();
// collar and bell
ctx.strokeStyle='#d34e9d';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,35,30,.18,Math.PI-.18);ctx.stroke();ctx.fillStyle='#ffd34d';ctx.shadowColor='#ffdf62';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,45,9,0,7);ctx.fill();ctx.strokeStyle='#a86a16';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,42);ctx.lineTo(0,50);ctx.stroke();ctx.restore()}
function drawCandy(){ctx.save();ctx.translate(candy.x,candy.y);ctx.rotate(t*1.8+(candy.vx||0)*.001);ctx.shadowColor='#ff477e';ctx.shadowBlur=22;let g=ctx.createRadialGradient(-8,-9,2,0,0,27);g.addColorStop(0,'#fff9f4');g.addColorStop(.55,'#ff5b75');g.addColorStop(1,'#a90d45');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,candy.r,0,Math.PI*2);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(0,0,21,0,Math.PI*2);ctx.clip();for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*Math.PI/3+t*.45);ctx.strokeStyle='#fff8ed';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-25,-8);ctx.bezierCurveTo(-10,-22,7,-22,24,-7);ctx.stroke();ctx.restore()}ctx.restore();ctx.strokeStyle='#ffd6e4';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.stroke();ctx.restore()}
function draw(){bg();for(const s of stars)if(!s.got)drawStar(s.x,s.y,.9);for(const r of ropes)if(r.alive){ctx.lineCap='round';ctx.strokeStyle='#f4b76c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(r.ax,r.ay);ctx.lineTo(candy.x,candy.y);ctx.stroke();ctx.strokeStyle='#fff0b4';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(r.ax,r.ay);ctx.lineTo(candy.x,candy.y);ctx.stroke();ctx.fillStyle='#57bfff';ctx.beginPath();ctx.arc(r.ax,r.ay,8,0,7);ctx.fill();ctx.strokeStyle='#d8f7ff';ctx.lineWidth=3;ctx.stroke()}drawCandy();drawKitten()}
function win(){active=false;modal.style.display='grid';document.querySelector('#title').textContent='Ура! 🍬';document.querySelector('#desc').textContent='Котик съел конфетку! Ты собрал(а) '+score+' из 3 звёзд.';start.textContent='Играть ещё'}
function lose(){active=false;modal.style.display='grid';document.querySelector('#title').textContent='Попробуем ещё?';document.querySelector('#desc').textContent='Конфетка пролетела мимо. Перережь верёвки в другой последовательности!';start.textContent='Повторить'}
function frame(now){if(!active||paused)return;let dt=Math.min((now-last)/1000,.025);last=now;t+=dt;let alive=ropes.filter(r=>r.alive);if(alive.length===1){let r=alive[0];r.omega+=(-28/r.len*Math.sin(r.angle))*dt;r.omega*=.9998;r.angle+=r.omega*dt;candy.x=r.ax+Math.sin(r.angle)*r.len;candy.y=r.ay+Math.cos(r.angle)*r.len;candy.vx=Math.cos(r.angle)*r.len*r.omega;candy.vy=-Math.sin(r.angle)*r.len*r.omega}else if(alive.length===0){candy.vy+=2400*dt;candy.x+=candy.vx*dt;candy.y+=candy.vy*dt}
for(const s of stars)if(!s.got&&Math.hypot(candy.x-s.x,candy.y-s.y)<29){s.got=true;score++;document.querySelector('#score').textContent=['★ ☆ ☆','★ ★ ☆','★ ★ ★'][score-1]}
if(alive.length===0&&candy.y>H*.78&&Math.abs(candy.x-W*.5)<82){draw();setTimeout(win,250);return}if(candy.y>H+40||candy.x<-40||candy.x>W+40){draw();setTimeout(lose,200);return}draw();requestAnimationFrame(frame)}
function launch(){init();resize();modal.style.display='none';active=true;paused=false;last=performance.now();requestAnimationFrame(frame)}
start.addEventListener('click',launch);document.querySelector('#restart').addEventListener('click',()=>{if(active)launch();else{init();draw()}});document.querySelector('#pause').addEventListener('click',()=>{if(!active)return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';if(!paused){last=performance.now();requestAnimationFrame(frame)}});window.addEventListener('resize',()=>{resize();if(active){init();draw()}});resize();init();draw();
})();
</script></body></html>
