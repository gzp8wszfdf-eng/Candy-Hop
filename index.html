<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#261448"><title>Candy Hop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#261448}#game{position:relative;width:min(100%,520px);height:100dvh;margin:auto;background:linear-gradient(180deg,#73d2ff 0%,#d9b0ff 65%,#ffe5ac 100%);overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-weight:900;text-shadow:0 2px 4px #43205c;pointer-events:none}.hud span{background:#5d3597c9;padding:8px 12px;border:2px solid #fff8;border-radius:16px}.hint{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 5px #45215f;pointer-events:none}.modal{position:absolute;inset:0;background:#25113dcc;display:grid;place-items:center;padding:22px}.panel{width:min(100%,340px);text-align:center;background:linear-gradient(145deg,#a45fe8,#5730a6);border:3px solid #ffe3ff;border-radius:28px;padding:24px;color:#fff;box-shadow:0 10px 0 #32165f}h1{margin:0 0 8px;font-size:30px}button{border:0;border-radius:18px;background:linear-gradient(#fff078,#ffb52f);padding:14px 28px;font-weight:1000;font-size:19px;color:#5b2c00;box-shadow:0 5px 0 #c4771a;cursor:pointer}small{display:block;margin-top:12px;opacity:.9}
</style></head><body><main id="game"><canvas id="c"></canvas><div class="hud"><span>⭐ <b id="score">0</b>/3</span><span>Уровень 1</span><span>✂️ <b id="cuts">0</b></span></div><div class="hint" id="hint">Проведи пальцем по верёвкам, чтобы перерезать их</div><section class="modal" id="modal"><div class="panel"><h1 id="title">🍬 Candy Hop</h1><div style="font-size:66px">🐈‍⬛</div><p id="desc">Перережь верёвки, собери звёзды и доставь конфетку котику!</p><button id="start">Начать уровень</button><small>Свайпай по верёвкам ✂️</small></div></section></main>
<script>
(()=>{const game=document.querySelector('#game'),cv=document.querySelector('#c'),ctx=cv.getContext('2d'),modal=document.querySelector('#modal'),start=document.querySelector('#start');let W=0,H=0,dpr=1,active=false,last=0,elapsed=0,cutCount=0,score=0,won=false,candy,ropes=[],stars=[];
function resize(){const r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!active)draw()}
function reset(){candy={x:W/2,y:H*.28,vx:0,vy:0,r:19};ropes=[{x:W*.2,y:H*.08,alive:true},{x:W*.8,y:H*.08,alive:true}];stars=[{x:W*.28,y:H*.45,got:false},{x:W*.72,y:H*.53,got:false},{x:W*.5,y:H*.68,got:false}];cutCount=score=0;won=false;document.querySelector('#score').textContent='0';document.querySelector('#cuts').textContent='0';document.querySelector('#hint').textContent='Проведи пальцем по верёвкам, чтобы перерезать их'}
function dist(px,py,x1,y1,x2,y2){let dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
function cutAt(x,y){if(!active)return;for(const r of ropes){if(r.alive&&dist(x,y,r.x,r.y,candy.x,candy.y)<22){r.alive=false;cutCount++;document.querySelector('#cuts').textContent=cutCount}}}
let pointer=false;cv.addEventListener('pointerdown',e=>{pointer=true;const r=cv.getBoundingClientRect();cutAt(e.clientX-r.left,e.clientY-r.top)});cv.addEventListener('pointermove',e=>{if(!pointer)return;const r=cv.getBoundingClientRect();cutAt(e.clientX-r.left,e.clientY-r.top)});window.addEventListener('pointerup',()=>pointer=false);window.addEventListener('pointercancel',()=>pointer=false);
function candyDraw(){ctx.save();ctx.translate(candy.x,candy.y);ctx.rotate(elapsed*1.2);ctx.fillStyle='#ff477e';ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,13,-2.3,2.3);ctx.stroke();ctx.restore()}
function catDraw(){ctx.textAlign='center';ctx.font='76px system-ui';ctx.fillText('🐈‍⬛',W/2,H*.86);ctx.font='bold 14px system-ui';ctx.fillStyle='#fff';ctx.fillText('НЯМ!',W/2,H*.91)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffff35';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc((i*97+22)%W,H*.17+(i%3)*58,20,0,7);ctx.fill()}ctx.fillStyle='#8bdb49';ctx.beginPath();ctx.ellipse(W/2,H*.96,W*.72,H*.12,0,0,7);ctx.fill();for(const s of stars)if(!s.got){ctx.font='29px system-ui';ctx.textAlign='center';ctx.fillText('⭐',s.x,s.y)}ctx.strokeStyle='#fff5d8';ctx.lineWidth=5;for(const r of ropes)if(r.alive){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(candy.x,candy.y);ctx.stroke();ctx.fillStyle='#8a4b31';ctx.beginPath();ctx.arc(r.x,r.y,5,0,7);ctx.fill()}candyDraw();catDraw()}
function finish(success){if(!active)return;active=false;modal.style.display='grid';document.querySelector('#title').textContent=success?'Ура! Конфетка съедена!':'Ой!';document.querySelector('#desc').textContent=success?'Ты собрал(а) '+score+' из 3 звёзд. Отличный уровень!':'Конфетка улетела. Попробуй ещё раз!';start.textContent='Сыграть ещё'}
function frame(t){if(!active)return;const dt=Math.min((t-last)/1000,.03);last=t;elapsed+=dt;if(!ropes.some(r=>r.alive)){candy.vy+=650*dt;candy.x+=candy.vx*dt;candy.y+=candy.vy*dt;for(const s of stars)if(!s.got&&Math.hypot(candy.x-s.x,candy.y-s.y)<31){s.got=true;score++;document.querySelector('#score').textContent=score}const target=H*.79;if(candy.y>target-20&&Math.abs(candy.x-W/2)<75){candy.y=target-20;candy.vy=0;if(!won){won=true;draw();setTimeout(()=>finish(true),350)}}else if(candy.y>H+35){draw();setTimeout(()=>finish(false),150)}}draw();if(active)requestAnimationFrame(frame)}
function launch(){resize();reset();modal.style.display='none';active=true;last=performance.now();requestAnimationFrame(frame)}
start.addEventListener('click',launch);window.addEventListener('resize',resize);reset();resize();})();
</script></body></html>
